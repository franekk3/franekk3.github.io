<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./icons/icon.png">
    <link rel="stylesheet" href="./style.css">
    <title> franekk3 </title>
</head>
<body>
    <div class="header-wrapper">
        <div id="container" class="container-main">
            <img style="height: 200px; width: 200px;" src="./icons/icon.png" alt="Logo">
            <p>Franekk3</p>
        </div>
    </div>
    <div class="container-secondary" id="content-box">
        <div class="section-box">
            <p style="font-size: 22px; font-weight: bold; font-family: sans-serif; color: rgb(91, 50, 0);"> Current projects: </p>
            <div class="content-container">
                <p class="content-container-label" onclick="window.location.href = 'https://franekk3.github.io/Fisq';"> Fisq! </p>
            </div>
            <div class="content-container">
                <p class="content-container-label" onclick="window.location.href = 'https://franekk3.github.io/Cubyy';"> Cubyy </p>
            </div>
        </div>
        <div class="section-box">
            <p style="font-size: 22px; font-weight: bold; font-family: sans-serif; color: rgb(91, 50, 0);"> My domains: </p>
            <div class="content-container" onclick="window.location.href = 'https://franekk3.github.io';">
                <p class="content-container-label" > franekk3.github.io </p>
            </div>
            <div class="content-container" onclick="window.location.href = 'https://franekk3.vercel.app/';">
                <p class="content-container-label" > franekk3.vercel.app </p>
            </div>
        </div>
        <div class="section-box" style="margin-bottom: 135px;">
            <p style="font-size: 22px; font-weight: bold; font-family: sans-serif; color: rgb(91, 50, 0);"> Info: </p>
            <div class="content-container">
                <p class="content-container-label"> About </p>
            </div>
            <div class="content-container">
                <p class="content-container-label"> GitHub </p>
            </div>
        </div>
    </div>
    <div style="opacity: 0; height: 400px;" ><p> . </p>
    </div>
    <script>
            window.onscroll = function() {
                const kontener = document.getElementById('container');
                const content = document.getElementById('content-box');
                
                if (window.scrollY > 100) {
                    kontener.classList.add('sticky');
                    content.classList.add('animation-flyIn')
                    content.classList.remove('animation-flyOut')
                } else {
                    kontener.classList.remove('sticky');
                    content.classList.remove('animation-flyIn')
                    content.classList.add('animation-flyOut')
                }
            };
    </script>
    </body>
</html>
